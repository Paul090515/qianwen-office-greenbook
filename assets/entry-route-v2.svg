  <rect x="167" y="200" width="126" height="188" rx="18" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="230" cy="239" r="22" fill="#173B2B" stroke="none" stroke-width="2" />
