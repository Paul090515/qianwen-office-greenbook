<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 590" width="460" height="590" role="img" aria-labelledby="title desc">
  <title id="title">按资料位置选入口</title>
  <desc id="desc">先看材料在哪，再选适合的入口；绿色绿皮书原创教学图解。</desc>
  <rect x="0" y="0" width="460" height="590" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="24" y="43" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="start">按资料位置选入口</text>
  <text x="26" y="75" fill="#53645A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">先看材料在哪，再选适合的入口</text>
  <circle cx="230" cy="119" r="37" fill="#E7F2EA" stroke="#2F7653" stroke-width="3" />
