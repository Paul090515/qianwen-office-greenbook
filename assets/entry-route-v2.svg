  <circle cx="375" cy="239" r="22" fill="#2F7653" stroke="none" stroke-width="2" />
  <rect x="367" y="231" width="16" height="16" rx="3" fill="#FFFFFF" stroke="none" stroke-width="2" />
  <line x1="375" y1="247" x2="365" y2="255" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="375" y1="247" x2="385" y2="255" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <text x="375" y="282" fill="#173B2B" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">组织</text>
  <text x="375" y="316" fill="#1D2923" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="middle">已有钉钉工作区</text>
  <rect x="322" y="337" width="106" height="36" rx="12" fill="#D7EBDD" stroke="none" stroke-width="2" />
  <text x="375" y="362" fill="#2F7653" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">组织入口</text>
  <rect x="28" y="416" width="404" height="112" rx="18" fill="#F3EBD8" stroke="#D7A94B" stroke-width="2" />
  <text x="49" y="450" fill="#173B2B" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">三个入口都要再确认</text>
  <text x="49" y="480" fill="#1D2923" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="550" text-anchor="start">当前空间：个人 / 组织</text>
  <text x="49" y="510" fill="#1D2923" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="550" text-anchor="start">当前权限：只给本任务所需</text>
</svg>