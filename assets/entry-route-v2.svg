  <line x1="89" y1="178" x2="371" y2="178" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <line x1="85" y1="178" x2="85" y2="200" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <rect x="22" y="200" width="126" height="188" rx="18" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="85" cy="239" r="22" fill="#2F7653" stroke="none" stroke-width="2" />
  <rect x="76" y="229" width="17" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="2" />
  <line x1="80" y1="236" x2="89" y2="236" stroke="#2F7653" stroke-width="2" stroke-linecap="round" />
  <text x="85" y="282" fill="#173B2B" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">网页</text>
  <text x="85" y="316" fill="#1D2923" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="middle">文件在手边</text>
  <rect x="32" y="337" width="106" height="36" rx="12" fill="#D7EBDD" stroke="none" stroke-width="2" />
  <text x="85" y="362" fill="#2F7653" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">上传文件</text>
