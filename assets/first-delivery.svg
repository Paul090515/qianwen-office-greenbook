<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 590" width="460" height="590" role="img" aria-labelledby="title desc">
  <title id="title">先做出一件小成果</title>
  <desc id="desc">从具体任务走到可核对的交付；本书原创教学示意。</desc>
  <rect x="0" y="0" width="460" height="590" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="28" y="44" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="750" text-anchor="start">先做出一件小成果</text>
  <text x="30" y="76" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">从具体任务走到可核对的交付</text>
  <circle cx="55" cy="148" r="23" fill="#2F7653" />
  <text x="55" y="156" fill="#FFFFFF" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">1</text>
  <rect x="92" y="119" width="337" height="70" rx="16" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="112" y="149" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">选具体成果</text>
  <text x="112" y="175" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">通知、清单或一页说明</text>
  <line x1="55" y1="172" x2="55" y2="224" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <path d="M 49 216 L 55 225 L 61 216" stroke="#2F7653" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="55" cy="242" r="23" fill="#2F7653" />
  <text x="55" y="250" fill="#FFFFFF" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">2</text>
  <rect x="92" y="213" width="337" height="70" rx="16" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="112" y="243" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">给出材料</text>
  <text x="112" y="269" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">只交本次需要的内容</text>
  <line x1="55" y1="266" x2="55" y2="318" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <path d="M 49 310 L 55 319 L 61 310" stroke="#2F7653" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="55" cy="336" r="23" fill="#2F7653" />
  <text x="55" y="344" fill="#FFFFFF" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">3</text>
  <rect x="92" y="307" width="337" height="70" rx="16" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="112" y="337" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">先做草稿</text>
  <text x="112" y="363" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">标出未知，不先发布</text>
  <line x1="55" y1="360" x2="55" y2="412" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <path d="M 49 404 L 55 413 L 61 404" stroke="#2F7653" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="55" cy="430" r="23" fill="#173B2B" />
  <text x="55" y="438" fill="#FFFFFF" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle">4</text>
  <rect x="92" y="401" width="337" height="70" rx="16" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="112" y="431" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">核对交付</text>
  <text x="112" y="457" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">检查事实，再保存成品</text>
  <rect x="30" y="493" width="400" height="40" rx="14" fill="#F3EBD8" stroke="#D7A94B" stroke-width="2" />
  <text x="230" y="520" fill="#173B2B" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="650" text-anchor="middle">资料不全 → 先标“待确认”</text>
  <rect x="27" y="548" width="406" height="29" rx="14" fill="#E7F2EA" stroke="none" stroke-width="2" />
  <text x="230" y="570" fill="#173B2B" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="650" text-anchor="middle">本书原创教学示意</text>
</svg>