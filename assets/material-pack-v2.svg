<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 640" width="460" height="640" role="img" aria-labelledby="title desc">
  <title id="title">交材料前先核对</title>
  <desc id="desc">把版本和范围说清，减少拿错资料；绿色绿皮书原创教学图解。</desc>
  <rect x="0" y="0" width="460" height="640" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="24" y="43" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="start">交材料前先核对</text>
  <text x="26" y="75" fill="#53645A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">把版本和范围说清，减少拿错资料</text>
  <rect x="32" y="105" width="396" height="440" rx="18" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <rect x="32" y="105" width="396" height="63" rx="18" fill="#2F7653" stroke="none" stroke-width="2" />
  <rect x="32" y="150" width="396" height="18" rx="0" fill="#2F7653" stroke="none" stroke-width="2" />
  <text x="57" y="145" fill="#FFFFFF" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">资料封面卡</text>
  <rect x="50" y="188" width="360" height="62" rx="13" fill="#E7F2EA" stroke="none" stroke-width="2" />
  <rect x="63" y="205" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#2F7653" stroke-width="2" />
  <text x="102" y="215" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">文件名</text>
  <text x="102" y="239" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">写出完整名称</text>
  <rect x="50" y="258" width="360" height="62" rx="13" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <rect x="63" y="275" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#2F7653" stroke-width="2" />
  <text x="102" y="285" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">版本日期</text>
  <text x="102" y="309" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">标清更新时间</text>
  <rect x="50" y="328" width="360" height="62" rx="13" fill="#E7F2EA" stroke="none" stroke-width="2" />
  <rect x="63" y="345" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#2F7653" stroke-width="2" />
  <text x="102" y="355" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">采用哪版</text>
  <text x="102" y="379" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">指定本次使用版本</text>
  <rect x="50" y="398" width="360" height="62" rx="13" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <rect x="63" y="415" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#2F7653" stroke-width="2" />
  <text x="102" y="425" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">读到哪页</text>
  <text x="102" y="449" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">圈定页码或范围</text>
  <rect x="50" y="468" width="360" height="62" rx="13" fill="#E7F2EA" stroke="none" stroke-width="2" />
  <rect x="63" y="485" width="26" height="26" rx="6" fill="#FFFFFF" stroke="#2F7653" stroke-width="2" />
  <text x="102" y="495" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">冲突待确认</text>
  <text x="102" y="519" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">有矛盾先标出，不猜</text>
  <text x="230" y="590" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">资料不一致时，先暂停确认</text>
</svg>