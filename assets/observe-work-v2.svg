<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 585" width="460" height="585" role="img" aria-labelledby="title desc">
  <title id="title">读懂任务的进展</title>
  <desc id="desc">四格检查票：看说明、看动作、看产物、再核对；绿色绿皮书原创教学图解。</desc>
  <rect x="0" y="0" width="460" height="585" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="24" y="43" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="start">读懂任务的进展</text>
  <text x="26" y="75" fill="#53645A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">四格检查票：看说明、看动作、看产物、再核对</text>
  <rect x="24" y="111" width="200" height="166" rx="18" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="54" cy="143" r="14" fill="#FFFFFF" stroke="#2F7653" stroke-width="3" />
  <line x1="47" y1="143" x2="53" y2="149" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <line x1="53" y1="149" x2="63" y2="136" stroke="#2F7653" stroke-width="3" stroke-linecap="round" />
  <text x="78" y="151" fill="#173B2B" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">任务说明</text>
  <line x1="42" y1="171" x2="206" y2="171" stroke="#A9C5B1" stroke-width="2" stroke-linecap="round" />
  <text x="42" y="205" fill="#1D2923" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="start">目标是什么？</text>
  <text x="42" y="240" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">材料和限制说清了吗？</text>
  <rect x="236" y="111" width="200" height="166" rx="18" fill="#E8F0F4" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="266" cy="143" r="14" fill="#FFFFFF" stroke="#56768C" stroke-width="3" />
  <line x1="259" y1="143" x2="265" y2="149" stroke="#56768C" stroke-width="3" stroke-linecap="round" />
  <line x1="265" y1="149" x2="275" y2="136" stroke="#56768C" stroke-width="3" stroke-linecap="round" />
  <text x="290" y="151" fill="#173B2B" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">正在操作</text>
  <line x1="254" y1="171" x2="418" y2="171" stroke="#A9C5B1" stroke-width="2" stroke-linecap="round" />
  <text x="254" y="205" fill="#1D2923" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="start">走到哪一步？</text>
  <text x="254" y="240" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">是否卡在授权或读取？</text>
  <rect x="24" y="302" width="200" height="166" rx="18" fill="#F3EBD8" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="54" cy="334" r="14" fill="#FFFFFF" stroke="#A2762A" stroke-width="3" />
  <line x1="47" y1="334" x2="53" y2="340" stroke="#A2762A" stroke-width="3" stroke-linecap="round" />
  <line x1="53" y1="340" x2="63" y2="327" stroke="#A2762A" stroke-width="3" stroke-linecap="round" />
  <text x="78" y="342" fill="#173B2B" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">实际产物</text>
  <line x1="42" y1="362" x2="206" y2="362" stroke="#A9C5B1" stroke-width="2" stroke-linecap="round" />
  <text x="42" y="396" fill="#1D2923" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="start">文件存在哪里？</text>
  <text x="42" y="431" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">是草稿还是最终稿？</text>
  <rect x="236" y="302" width="200" height="166" rx="18" fill="#E8EFE9" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="266" cy="334" r="14" fill="#FFFFFF" stroke="#173B2B" stroke-width="3" />
  <line x1="259" y1="334" x2="265" y2="340" stroke="#173B2B" stroke-width="3" stroke-linecap="round" />
  <line x1="265" y1="340" x2="275" y2="327" stroke="#173B2B" stroke-width="3" stroke-linecap="round" />
  <text x="290" y="342" fill="#173B2B" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">人工核对</text>
  <line x1="254" y1="362" x2="418" y2="362" stroke="#A9C5B1" stroke-width="2" stroke-linecap="round" />
  <text x="254" y="396" fill="#1D2923" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="start">事实对得上吗？</text>
  <text x="254" y="431" fill="#53645A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">缺项和误差记下来了吗？</text>
  <rect x="26" y="500" width="408" height="49" rx="15" fill="#173B2B" stroke="none" stroke-width="2" />
  <text x="230" y="532" fill="#FFFFFF" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">看到结果，才算知道做到哪</text>
</svg>