  <text x="30" y="76" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">保留来源，不把意见写成决定</text>
  <rect x="120" y="96" width="220" height="49" rx="15" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
