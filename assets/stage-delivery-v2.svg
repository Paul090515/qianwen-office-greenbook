<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 650" width="460" height="650" role="img" aria-labelledby="title desc">
  <title id="title">复杂工作分次交付</title>
  <desc id="desc">每一关先达到条件，再进入下一关；绿色绿皮书原创教学图解。</desc>
  <rect x="0" y="0" width="460" height="650" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="24" y="43" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="start">复杂工作分次交付</text>
  <text x="26" y="75" fill="#53645A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">每一关先达到条件，再进入下一关</text>
  <rect x="27" y="111" width="405" height="78" rx="16" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="54" cy="138" r="14" fill="#2F7653" stroke="none" stroke-width="2" />
  <text x="54" y="145" fill="#FFFFFF" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">1</text>
  <text x="80" y="143" fill="#173B2B" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">资料包</text>
  <text x="80" y="171" fill="#1D2923" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">通过条件：所需文件齐全</text>
  <rect x="47" y="218" width="385" height="78" rx="16" fill="#E2EEE5" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="74" cy="245" r="14" fill="#2F7653" stroke="none" stroke-width="2" />
  <text x="74" y="252" fill="#FFFFFF" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">2</text>
  <text x="100" y="250" fill="#173B2B" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">已确认清单</text>
  <text x="100" y="278" fill="#1D2923" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">通过条件：口径与范围确认</text>
  <rect x="67" y="325" width="365" height="78" rx="16" fill="#D9E9DD" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="94" cy="352" r="14" fill="#2F7653" stroke="none" stroke-width="2" />
  <text x="94" y="359" fill="#FFFFFF" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">3</text>
  <text x="120" y="357" fill="#173B2B" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">成果草稿</text>
  <text x="120" y="385" fill="#1D2923" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">通过条件：结构完整可修改</text>
  <rect x="87" y="432" width="345" height="78" rx="16" fill="#D0E4D5" stroke="#A9C5B1" stroke-width="2" />
  <circle cx="114" cy="459" r="14" fill="#173B2B" stroke="none" stroke-width="2" />
  <text x="114" y="466" fill="#FFFFFF" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">4</text>
  <text x="140" y="464" fill="#173B2B" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">成品与交接</text>
  <text x="140" y="492" fill="#1D2923" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">通过条件：核对并说明去向</text>
  <line x1="31" y1="125" x2="31" y2="504" stroke="#D7A94B" stroke-width="3" stroke-linecap="round" />
  <text x="230" y="564" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">一次只推进到一个可检查的结果</text>
</svg>