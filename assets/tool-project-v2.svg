<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 660" width="460" height="660" role="img" aria-labelledby="title desc">
  <title id="title">共享工具角项目核对</title>
  <desc id="desc">先看总数，再看借出物品的到期状态；绿色绿皮书原创教学图解。</desc>
  <rect x="0" y="0" width="460" height="660" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="24" y="43" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="start">共享工具角项目核对</text>
  <text x="26" y="75" fill="#53645A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="start">先看总数，再看借出物品的到期状态</text>
  <rect x="26" y="114" width="128" height="115" rx="18" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="90" y="153" fill="#53645A" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">工具总数</text>
  <text x="90" y="202" fill="#173B2B" font-size="35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="middle">10</text>
  <rect x="166" y="114" width="128" height="115" rx="18" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="230" y="153" fill="#53645A" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">在架</text>
  <text x="230" y="202" fill="#173B2B" font-size="35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="middle">4</text>
  <rect x="306" y="114" width="128" height="115" rx="18" fill="#173B2B" stroke="#2F7653" stroke-width="2" />
  <text x="370" y="153" fill="#FFFFFF" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">借出</text>
  <text x="370" y="202" fill="#FFFFFF" font-size="35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="middle">6</text>
  <text x="230" y="272" fill="#173B2B" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="middle">借出的 6 件，按到期情况分组</text>
  <rect x="30" y="299" width="400" height="151" rx="18" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <rect x="45" y="321" width="103" height="105" rx="15" fill="#F3EBD8" stroke="none" stroke-width="2" />
  <text x="96" y="354" fill="#A2762A" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">逾期</text>
  <text x="96" y="405" fill="#173B2B" font-size="29" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="middle">2</text>
  <rect x="178" y="321" width="103" height="105" rx="15" fill="#E8F0F4" stroke="none" stroke-width="2" />
  <text x="229" y="354" fill="#56768C" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">今日到期</text>
  <text x="229" y="405" fill="#173B2B" font-size="29" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="middle">1</text>
  <rect x="311" y="321" width="103" height="105" rx="15" fill="#E7F2EA" stroke="none" stroke-width="2" />
  <text x="362" y="354" fill="#2F7653" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">未到期</text>
  <text x="362" y="405" fill="#173B2B" font-size="29" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="750" text-anchor="middle">3</text>
  <text x="230" y="477" fill="#53645A" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">2 + 1 + 3 = 6 件借出</text>
  <rect x="29" y="503" width="402" height="107" rx="17" fill="#E2EEE5" stroke="#A9C5B1" stroke-width="2" />
  <text x="49" y="532" fill="#173B2B" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" text-anchor="start">项目产出</text>
  <rect x="67" y="550" width="101" height="39" rx="11" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="117" y="575" fill="#2F7653" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">盘点表</text>
  <rect x="180" y="550" width="101" height="39" rx="11" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="230" y="575" fill="#2F7653" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">取还说明</text>
  <rect x="300" y="550" width="101" height="39" rx="11" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="350" y="575" fill="#2F7653" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="650" text-anchor="middle">交接清单</text>
</svg>