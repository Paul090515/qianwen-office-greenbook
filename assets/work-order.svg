<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 590" width="460" height="590" role="img" aria-labelledby="title desc">
  <title id="title">一张工作单</title>
  <desc id="desc">六格说清要求，少让 AI 猜；本书原创教学示意。</desc>
  <rect x="0" y="0" width="460" height="590" rx="0" fill="#F5F8F4" stroke="none" stroke-width="2" />
  <text x="28" y="44" fill="#173B2B" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="750" text-anchor="start">一张工作单</text>
  <text x="30" y="76" fill="#53645A" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" text-anchor="start">六格说清要求，少让 AI 猜</text>
  <rect x="25" y="104" width="198" height="105" rx="16" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="45" y="146" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">目标</text>
  <text x="43" y="181" fill="#1D2923" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="550" text-anchor="start">具体要完成什么</text>
  <rect x="237" y="104" width="198" height="105" rx="16" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="257" y="146" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">读者</text>
  <text x="255" y="181" fill="#1D2923" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="550" text-anchor="start">谁会看或使用</text>
  <rect x="25" y="229" width="198" height="105" rx="16" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="45" y="271" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">材料</text>
  <text x="43" y="306" fill="#1D2923" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="550" text-anchor="start">依据哪些资料</text>
  <rect x="237" y="229" width="198" height="105" rx="16" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="257" y="271" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">交付</text>
  <text x="255" y="306" fill="#1D2923" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="550" text-anchor="start">格式、长度、文件</text>
  <rect x="25" y="354" width="198" height="105" rx="16" fill="#E7F2EA" stroke="#A9C5B1" stroke-width="2" />
  <text x="45" y="396" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">限制</text>
  <text x="43" y="431" fill="#1D2923" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="550" text-anchor="start">哪些不能改或做</text>
  <rect x="237" y="354" width="198" height="105" rx="16" fill="#FFFFFF" stroke="#A9C5B1" stroke-width="2" />
  <text x="257" y="396" fill="#173B2B" font-size="23" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="start">验收</text>
  <text x="255" y="431" fill="#1D2923" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="550" text-anchor="start">怎么判断做好</text>
  <rect x="26" y="482" width="408" height="47" rx="14" fill="#D7EBDD" stroke="#A9C5B1" stroke-width="2" />
  <text x="230" y="512" fill="#173B2B" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="650" text-anchor="middle">六格填好，再开始执行</text>
  <rect x="27" y="548" width="406" height="29" rx="14" fill="#E7F2EA" stroke="none" stroke-width="2" />
  <text x="230" y="570" fill="#173B2B" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="650" text-anchor="middle">本书原创教学示意</text>
</svg>